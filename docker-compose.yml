services:
  postgres-dw:
    image: postgres:16-alpine
    container_name: postgres-dw
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DW_ADMIN_USER: ${DW_ADMIN_USER}
      DW_ADMIN_PASSWORD: ${DW_ADMIN_PASSWORD}
      METABASE_DB_NAME: ${METABASE_DB_NAME}
      DW_DB_NAME: ${DW_DB_NAME}
      OLTP_DB_NAME: ${OLTP_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bi-net

  hop-web:
    image: apache/hop-web:2.20.0
    container_name: hop-web
    restart: unless-stopped
    ports:
      - "${HOP_PORT}:8080"
    environment:
      HOP_CONFIG_FOLDER: /hop/config
      HOP_AUDIT_FOLDER: /hop/audit
      HOP_PROJECT_NAME: bi-learn
      HOP_PROJECT_FOLDER: /hop/projects/bi-learn
      HOP_SHARED_JDBC_FOLDERS: /usr/local/tomcat/jdbc-drivers,/hop/jdbc
      HOP_WEB_SECURITY_MODE: BASIC
      HOP_WEB_ADMIN_USER: ${HOP_WEB_ADMIN_USER}
      HOP_WEB_ADMIN_PASSWORD: ${HOP_WEB_ADMIN_PASSWORD}
      OLTP_DB_HOST: postgres-dw
      OLTP_DB_PORT: 5432
      OLTP_DB_NAME: ${OLTP_DB_NAME}
      DW_DB_HOST: postgres-dw
      DW_DB_PORT: 5432
      DW_DB_NAME: ${DW_DB_NAME}
      DW_ADMIN_USER: ${DW_ADMIN_USER}
      DW_ADMIN_PASSWORD: ${DW_ADMIN_PASSWORD}
    volumes:
      - hop-config:/hop/config
      - hop-audit:/hop/audit
      - ./hop-projects:/hop/projects
      - ./hop-jdbc:/hop/jdbc
    depends_on:
      postgres-dw:
        condition: service_healthy
    networks:
      - bi-net

  metabase:
    image: metabase/metabase:v0.64.6
    container_name: metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${DW_ADMIN_USER}
      MB_DB_PASS: ${DW_ADMIN_PASSWORD}
      MB_DB_HOST: postgres-dw
      JAVA_TIMEZONE: ${TZ}
    depends_on:
      postgres-dw:
        condition: service_healthy
    networks:
      - bi-net

volumes:
  pg-data:
  hop-config:
  hop-audit:

networks:
  bi-net:
    driver: bridge
